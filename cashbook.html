<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자금일보</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--surface:#f8f9fa;--border:#e9ecef;
  --text:#1a1d23;--muted:#6c757d;
  --accent:#2563eb;--accent-bg:#eff6ff;
  --green:#16a34a;--green-bg:#f0fdf4;
  --red:#dc2626;--red-bg:#fef2f2;
  --gold:#d97706;--gold-bg:#fffbeb;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
/* 헤더 */
header{background:#fff;border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:100;height:54px}
.logo{font-size:17px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}
.logo span{color:var(--accent)}
nav{display:flex;gap:2px;overflow-x:auto}
.nav-btn{padding:5px 14px;border:none;background:none;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;border-radius:6px;transition:.15s;white-space:nowrap;font-family:inherit}
.nav-btn:hover{background:var(--surface);color:var(--text)}
.nav-btn.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
/* 메인 */
main{max-width:1320px;margin:0 auto;padding:24px 28px}
.page{display:none}.page.active{display:block}
/* 업로드 */
.upload-tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:0}
.utab{padding:8px 18px;border:none;background:none;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;transition:.15s}
.utab:hover{color:var(--text)}
.utab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.upload-zone{border:2px dashed var(--border);border-radius:14px;padding:40px;text-align:center;cursor:pointer;transition:.2s;background:var(--bg);margin-bottom:16px}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:var(--accent-bg)}
.upload-zone.done{border-color:var(--green);background:var(--green-bg);border-style:solid}
.uz-icon{font-size:36px;margin-bottom:10px}
.uz-title{font-size:15px;font-weight:600;margin-bottom:4px}
.uz-sub{font-size:12px;color:var(--muted)}
.upload-hint{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.hint-tag{padding:3px 10px;background:var(--surface);border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--muted)}
.file-list{display:flex;flex-direction:column;gap:6px}
.file-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:13px}
.fi-name{flex:1;font-weight:500}.fi-cnt{color:var(--green);font-weight:600;font-size:12px}
.fi-del{border:none;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.fi-del:hover{color:var(--red)}
/* 매핑 모달 */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:680px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:16px;font-weight:700}
.modal-close{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.modal-body{padding:20px 24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.map-intro{font-size:13px;color:var(--muted);margin-bottom:16px;padding:10px 14px;background:var(--accent-bg);border-radius:8px;line-height:1.6}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.map-row{display:flex;flex-direction:column;gap:4px}
.map-label{font-size:11px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:4px}
.req{color:var(--red);font-size:10px}
.map-sel{padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:#fff;color:var(--text);outline:none;width:100%;font-family:inherit}
.map-sel:focus{border-color:var(--accent)}
.preview-wrap{background:var(--surface);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--muted);margin-bottom:4px;max-height:100px;overflow:auto}
.preview-wrap strong{color:var(--text);font-size:11px}
/* 필터바 */
.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px;padding:12px 16px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border)}
.filter-bar select,.filter-bar input{height:32px;padding:0 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff;color:var(--text);outline:none;font-family:inherit}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--accent)}
.pill-group{display:flex;gap:2px}
.pill{padding:5px 14px;border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;background:#fff;color:var(--muted);transition:.15s;font-family:inherit}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
/* 요약 카드 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.sc-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.sc-value{font-size:20px;font-weight:700;letter-spacing:-.5px}
.cv-in{color:var(--accent)}.cv-out{color:var(--red)}.cv-pos{color:var(--green)}.cv-neg{color:var(--red)}.cv-n{color:var(--text)}.cv-gold{color:var(--gold)}
/* 테이블 */
.tcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.thead-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border)}
.thead-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-in{background:var(--accent)}.dot-out{background:var(--red)}.dot-purple{background:var(--purple)}.dot-gold{background:var(--gold)}
.thead-total{font-size:13px;font-weight:700}
.t-in{color:var(--accent)}.t-out{color:var(--red)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{padding:8px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
tbody td{padding:9px 14px;border-bottom:1px solid #f3f4f6;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:0}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface)}
.ra{text-align:right}.amt-in{color:var(--accent);font-weight:600}.amt-out{color:var(--red);font-weight:600}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;background:var(--surface);color:var(--muted);white-space:nowrap}
.tag-b{background:var(--accent-bg);color:var(--accent)}.tag-r{background:var(--red-bg);color:var(--red)}
.tag-g{background:var(--green-bg);color:var(--green)}.tag-gold{background:var(--gold-bg);color:var(--gold)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
/* 2열 레이아웃 */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* 은행 카드 */
.bank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.bank-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.bank-name{font-size:13px;font-weight:600;margin-bottom:10px}
.bank-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid #f3f4f6}
.bank-row:last-child{border:none;padding-top:8px;font-weight:700;font-size:13px}
/* 차트 */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chart-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.chart-card h3{font-size:13px;font-weight:600;margin-bottom:14px}
/* 버튼 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--text);transition:.15s;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-p:hover{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.btn-sm{padding:4px 12px;font-size:12px}
.btn-g{background:var(--green);border-color:var(--green);color:#fff}
.btn-g:hover{background:#15803d;border-color:#15803d;color:#fff}
.sec-title{font-size:15px;font-weight:700;margin-bottom:14px}
/* 세금계산서/법인카드/현금영수증 서브탭 */
.sub-tabs{display:flex;gap:4px;margin-bottom:16px}
.sub-tab{padding:6px 16px;border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;background:#fff;color:var(--muted);font-family:inherit;transition:.15s}
.sub-tab:hover{border-color:var(--accent);color:var(--accent)}
.sub-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.ie-row td { background:#f0f9ff !important; vertical-align:middle; white-space:normal; overflow:visible; }
.ie-input { width:100%; padding:4px 8px; border:1px solid #d1d5db; border-radius:5px; font-size:12px; font-family:inherit; outline:none; }
.ie-input:focus { border-color:var(--accent); }
.ie-save { padding:3px 10px; border:none; border-radius:5px; font-size:11px; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; font-family:inherit; }
.ie-cancel { padding:3px 8px; border:1px solid var(--border); border-radius:5px; font-size:11px; cursor:pointer; background:#fff; color:var(--muted); font-family:inherit; }
.ie-del { padding:3px 8px; border:1px solid #fca5a5; border-radius:5px; font-size:11px; cursor:pointer; background:#fff; color:var(--red); font-family:inherit; }
.edit-btn { padding:2px 8px; border:1px solid var(--border); border-radius:4px; font-size:11px; cursor:pointer; background:#fff; color:var(--muted); font-family:inherit; white-space:nowrap; }
.edit-btn:hover { border-color:var(--accent); color:var(--accent); }
@media(max-width:768px){
  main{padding:16px}header{padding:0 16px}
  .two-col,.chart-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .map-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="logo">자금<span>일보</span></div>
  <nav>
    <button class="nav-btn active" onclick="showPage('upload')">📁 업로드</button>
    <button class="nav-btn" onclick="showPage('dash')">📊 자금일보</button>
    <button class="nav-btn" onclick="showPage('banks')">🏦 은행별</button>
    <button class="nav-btn" onclick="showPage('inv')">🧾 세금계산서</button>
    <button class="nav-btn" onclick="showPage('card')">💳 법인카드</button>
    <button class="nav-btn" onclick="showPage('rc')">🧾 현금영수증</button>
    <button class="nav-btn" onclick="showPage('chart')">📈 월별분석</button>
  </nav>
</header>

<main>

<!-- 업로드 -->
<div id="page-upload" class="page active">
  <div class="upload-tabs">
    <button class="utab active" onclick="setUTab('tx',this)">🏦 거래내역</button>
    <button class="utab" onclick="setUTab('inv',this)">🧾 세금계산서</button>
    <button class="utab" onclick="setUTab('card',this)">💳 법인카드</button>
    <button class="utab" onclick="setUTab('rc',this)">🧾 현금영수증</button>
  </div>

  <div id="uz-tx">
    <label for="fi-tx">
      <div class="upload-zone" id="dz-tx">
        <div class="uz-icon">🏦</div>
        <div class="uz-title">은행 거래내역 엑셀 업로드</div>
        <div class="uz-sub">클릭하거나 파일을 끌어다 놓으세요 · 업로드 후 컬럼을 직접 매핑할 수 있어요</div>
        <div class="upload-hint">
          <span class="hint-tag">국민은행</span><span class="hint-tag">기업은행</span><span class="hint-tag">신한은행</span>
          <span class="hint-tag">하나은행</span><span class="hint-tag">우리은행</span><span class="hint-tag">농협</span>
          <span class="hint-tag">카카오뱅크</span><span class="hint-tag">토스뱅크</span><span class="hint-tag">기타은행</span>
        </div>
      </div>
    </label>
    <input type="file" id="fi-tx" accept=".xlsx,.xls,.csv" multiple style="display:none" onchange="prepareFile('tx',this)">
    <div id="fl-tx" class="file-list"></div>
  </div>

  <div id="uz-inv" style="display:none">
    <label for="fi-inv">
      <div class="upload-zone" id="dz-inv">
        <div class="uz-icon">🧾</div>
        <div class="uz-title">세금계산서 엑셀 업로드</div>
        <div class="uz-sub">매출·매입 세금계산서 / 계산서를 업로드하세요</div>
      </div>
    </label>
    <input type="file" id="fi-inv" accept=".xlsx,.xls,.csv" multiple style="display:none" onchange="prepareFile('inv',this)">
    <div id="fl-inv" class="file-list"></div>
  </div>

  <div id="uz-card" style="display:none">
    <label for="fi-card">
      <div class="upload-zone" id="dz-card">
        <div class="uz-icon">💳</div>
        <div class="uz-title">법인카드 엑셀 업로드</div>
        <div class="uz-sub">법인카드 사용 내역을 업로드하세요</div>
      </div>
    </label>
    <input type="file" id="fi-card" accept=".xlsx,.xls,.csv" multiple style="display:none" onchange="prepareFile('card',this)">
    <div id="fl-card" class="file-list"></div>
  </div>

  <div id="uz-rc" style="display:none">
    <label for="fi-rc">
      <div class="upload-zone" id="dz-rc">
        <div class="uz-icon">🧾</div>
        <div class="uz-title">현금영수증 엑셀 업로드</div>
        <div class="uz-sub">현금영수증 수취·발행 내역을 업로드하세요</div>
      </div>
    </label>
    <input type="file" id="fi-rc" accept=".xlsx,.xls,.csv" multiple style="display:none" onchange="prepareFile('rc',this)">
    <div id="fl-rc" class="file-list"></div>
  </div>
</div>

<!-- 자금일보 -->
<div id="page-dash" class="page">
  <div class="filter-bar">
    <div class="pill-group">
      <button class="pill active" onclick="setP('monthly',this)">월별</button>
      <button class="pill" onclick="setP('custom',this)">기간지정</button>
    </div>
    <input type="month" id="fMonth">
    <div id="fCustom" style="display:none;gap:6px;align-items:center;display:none">
      <input type="date" id="fStart"><span style="color:var(--muted);font-size:12px">~</span><input type="date" id="fEnd">
    </div>
    <select id="fBank" style="min-width:110px"><option value="">전체 은행</option></select>
    <input type="text" id="fSearch" placeholder="거래처 검색..." style="width:140px" oninput="renderDash()">
  </div>
  <div class="stat-grid" id="dashStats"></div>
  <div class="two-col">
    <div class="tcard">
      <div class="thead-bar">
        <div class="thead-title"><span class="dot dot-in"></span>입금 내역</div>
        <div class="thead-total t-in" id="totIn">0원</div>
      </div>
      <table><thead><tr>
        <th style="width:84px">날짜</th><th>거래처명</th>
        <th style="width:88px">계정과목</th><th class="ra" style="width:100px">금액</th><th>주요내용</th><th style="width:44px"></th>
      </tr></thead><tbody id="tbIn"></tbody></table>
    </div>
    <div class="tcard">
      <div class="thead-bar">
        <div class="thead-title"><span class="dot dot-out"></span>출금 내역</div>
        <div class="thead-total t-out" id="totOut">0원</div>
      </div>
      <table><thead><tr>
        <th style="width:84px">날짜</th><th>거래처명</th>
        <th style="width:88px">계정과목</th><th class="ra" style="width:100px">금액</th><th>주요내용</th><th style="width:44px"></th>
      </tr></thead><tbody id="tbOut"></tbody></table>
    </div>
  </div>
</div>

<!-- 은행별 -->
<div id="page-banks" class="page">
  <div class="filter-bar">
    <div class="pill-group">
      <button class="pill active" onclick="setBP('monthly',this)">월별</button>
      <button class="pill" onclick="setBP('custom',this)">기간지정</button>
    </div>
    <input type="month" id="bMonth">
    <div id="bCustom" style="display:none;gap:6px;align-items:center">
      <input type="date" id="bStart"><span style="color:var(--muted);font-size:12px">~</span><input type="date" id="bEnd">
    </div>
  </div>
  <div id="bankGrid" class="bank-grid"></div>
  <div class="tcard">
    <div class="thead-bar"><div class="thead-title">전체 거래 내역</div></div>
    <table><thead><tr>
      <th style="width:84px">날짜</th><th style="width:100px">은행</th>
      <th>거래처명</th><th style="width:64px">구분</th><th class="ra" style="width:110px">금액</th><th>주요내용</th>
    </tr></thead><tbody id="tbBanks"></tbody></table>
  </div>
</div>

<!-- 세금계산서 -->
<div id="page-inv" class="page">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <div class="sub-tabs">
      <button class="sub-tab active" id="inv-s-out" onclick="setInvSub('out',this)">📤 매출(발행)</button>
      <button class="sub-tab" id="inv-s-in" onclick="setInvSub('in',this)">📥 매입(수취)</button>
    </div>
    <label for="fi-inv" class="btn btn-sm">📂 추가 업로드</label>
  </div>
  <div class="stat-grid" id="invStats"></div>
  <div class="tcard">
    <table><thead><tr>
      <th style="width:84px">작성일자</th><th>거래처명</th><th style="width:100px">사업자번호</th>
      <th>품목</th><th class="ra" style="width:100px">공급가액</th>
      <th class="ra" style="width:80px">세액</th><th class="ra" style="width:100px">합계</th><th>비고</th>
    </tr></thead><tbody id="tbInv"></tbody></table>
    <div id="sumInv" style="display:none;padding:10px 16px;border-top:1px solid var(--border);background:var(--surface);font-size:13px;display:none;gap:16px;font-weight:600"></div>
  </div>
</div>

<!-- 법인카드 -->
<div id="page-card" class="page">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <div class="sub-tabs">
      <button class="sub-tab active" id="card-s-in" onclick="setCardSub('in',this)">📥 매입(지출)</button>
      <button class="sub-tab" id="card-s-out" onclick="setCardSub('out',this)">📤 매출(수익)</button>

<script>
'use strict';

// ── 스토어 ─────────────────────────────────────────────
const SK = { tx:'jb-tx', inv:'jb-inv', card:'jb-card', rc:'jb-rc', map:'jb-map' };
let TXS  = load(SK.tx, []);
let INVS = load(SK.inv, []);
let CARDS= load(SK.card, []);
let RCS  = load(SK.rc, []);
let MAPS = load(SK.map, {});   // 저장된 컬럼 매핑 (파일명 → 매핑)

function load(k, def) {
  try { return JSON.parse(localStorage.getItem(k) || JSON.stringify(def)); } catch { return def; }
}
function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

// ── 유틸 ───────────────────────────────────────────────
function pNum(v) {
  if (v == null || v === '') return 0;
  const n = parseFloat(String(v).replace(/[^0-9.-]/g, ''));
  return isNaN(n) ? 0 : n;
}
function pDate(v) {
  if (!v) return '';
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  const s = String(v).replace(/T.*/, '').replace(/[./]/g, '-');
  const m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? m[1] + '-' + m[2].padStart(2,'0') + '-' + m[3].padStart(2,'0') : '';
}
function fmt(n) { return Math.abs(Number(n)).toLocaleString('ko-KR') + '원'; }
function today() { return new Date().toISOString().slice(0,10); }
function thisYM() { return new Date().toISOString().slice(0,7); }
function thisYMEnd() { const m=thisYM(); const d=new Date(+m.slice(0,4),+m.slice(5),0).getDate(); return m+'-'+String(d).padStart(2,'0'); }

// ── 계정과목 자동분류 ────────────────────────────────────
const CAT = [
  ['급여',['급여','월급','임금','인건비','salary','상여']],
  ['임차료',['임차료','월세','렌트','임대료']],
  ['복리후생비',['식대','경조사','야유회','회식','복리후생','체육대회']],
  ['여비교통비',['교통비','출장','택시','버스','주유','기차','항공']],
  ['통신비',['통신','kt','skt','lgu','인터넷','핸드폰','전화','팩스']],
  ['수도광열비',['전기','수도','가스','한전','도시가스','난방']],
  ['세금과공과금',['세금','국세','지방세','재산세','자동차세','협회비']],
  ['광고선전비',['광고','마케팅','홍보','네이버','카카오','구글']],
  ['보험료',['보험료','보험']],
  ['접대비',['접대','거래처접대']],
  ['수선비',['수선','수리','as','유지보수']],
  ['소모품비',['소모품','문구','사무용품','복사']],
  ['운반비',['택배','운송','배송','운반']],
  ['수수료비용',['수수료','이체수수료','은행수수료']],
  ['이자비용',['이자비용','대출이자','차입이자']],
  ['차량유지비',['주차','유류','차량유지','자동차']],
  ['이자수익',['이자수익','예금이자']],
  ['상품매출',['매출','판매','수금','납품','잔금']],
  ['잡이익',['환불','기타수익','잡이익']],
  ['단기차입금',['대출','차입','융자']],
];
function autoCat(name, memo, type) {
  const t = (name + ' ' + memo).toLowerCase();
  for (const [cat, kws] of CAT) if (kws.some(k => t.includes(k))) return cat;
  return type === 'in' ? '기타수익' : '기타비용';
}

// ── 업로드 탭 ──────────────────────────────────────────
let uTab = 'tx';
function setUTab(t, el) {
  uTab = t;
  document.querySelectorAll('.utab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  ['tx','inv','card','rc'].forEach(id => {
    document.getElementById('uz-' + id).style.display = id === t ? '' : 'none';
  });
}

// ── 파일 읽기 (공통) ────────────────────────────────────
let pendingFile = null;  // 매핑 전 임시 보관

function prepareFile(type, inp) {
  const files = Array.from(inp.files);
  inp.value = '';
  if (!files.length) return;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      // 헤더 행 찾기
      let hi = 0;
      for (let i = 0; i < Math.min(15, raw.length); i++) {
        if (raw[i].filter(c => String(c).trim()).length >= 3) { hi = i; break; }
      }
      const hdrs = raw[hi].map(h => String(h || '').trim());
      const rows = raw.slice(hi + 1).filter(r => r.some(c => String(c).trim()));
      pendingFile = { type, file, hdrs, rows };
      openMap(type, file.name, hdrs, rows);
    };
    reader.readAsArrayBuffer(file);
  });
}

// ── 컬럼 매핑 모달 ──────────────────────────────────────
// 타입별 필드 정의
const FIELDS = {
  tx: [
    { id:'date',  label:'날짜',           req:true,  hint:'거래일, 날짜, 거래일시' },
    { id:'in',    label:'입금액',          req:false, hint:'입금, 입금액, 입금금액 / 또는 금액(통합) 사용' },
    { id:'out',   label:'출금액',          req:false, hint:'출금, 출금액, 출금금액 / 또는 금액(통합) 사용' },
    { id:'amount',label:'금액(입출금통합)',req:false, hint:'금액 (양수=입금, 음수=출금)' },
    { id:'name',  label:'거래처명',        req:false, hint:'거래처, 적요, 내용, 사용처' },
    { id:'memo',  label:'주요내용/메모',   req:false, hint:'메모, 비고, 사유' },
    { id:'bank',  label:'은행/계좌',       req:false, hint:'거래수단, 계좌, 은행명' },
    { id:'cat',   label:'계정과목',        req:false, hint:'계정과목 (없으면 자동분류)' },
    { id:'balance',label:'잔액',          req:false, hint:'잔액, 잔고' },
  ],
  inv: [
    { id:'date',   label:'작성일자',   req:true,  hint:'날짜, 작성일, 발행일' },
    { id:'type',   label:'구분(매출/매입)', req:false, hint:'구분, 유형 (없으면 매출/매입 탭에서 선택)' },
    { id:'partner',label:'거래처명',   req:false, hint:'거래처, 상호, 공급받는자' },
    { id:'bizno',  label:'사업자번호', req:false, hint:'사업자번호, 사업자등록번호' },
    { id:'item',   label:'품목',       req:false, hint:'품목, 품명, 내용' },
    { id:'supply', label:'공급가액',   req:false, hint:'공급가액, 공급액' },
    { id:'tax',    label:'세액',       req:false, hint:'세액, 부가세' },
    { id:'total',  label:'합계금액',   req:false, hint:'합계, 총액, 합계금액' },
    { id:'memo',   label:'비고',       req:false, hint:'비고, 메모' },
  ],
  card: [
    { id:'date',    label:'사용일자',     req:true,  hint:'날짜, 사용일, 승인일' },
    { id:'type',    label:'구분(매출/매입)', req:false, hint:'구분 (없으면 매입으로 처리)' },
    { id:'company', label:'카드회사',     req:false, hint:'카드사, 카드회사, 카드명' },
    { id:'cardno',  label:'카드번호(뒤4)',req:false, hint:'카드번호, 카드뒤4자리' },
    { id:'holder',  label:'보유자',       req:false, hint:'보유자, 카드소유자' },
    { id:'user',    label:'사용자',       req:false, hint:'사용자, 사용직원' },
    { id:'merchant',label:'가맹점/거래처',req:false, hint:'가맹점, 거래처, 사용처' },
    { id:'bizno',   label:'사업자번호',   req:false, hint:'사업자번호' },
    { id:'supply',  label:'공급가액',     req:false, hint:'공급가액' },
    { id:'tax',     label:'세액/부가세',  req:false, hint:'세액, 부가세' },
    { id:'total',   label:'합계/금액',    req:false, hint:'합계, 금액, 결제금액' },
    { id:'memo',    label:'메모/비고',    req:false, hint:'메모, 비고, 사유' },
  ],
  rc: [
    { id:'date',   label:'날짜',           req:true,  hint:'날짜, 사용일, 거래일' },
    { id:'type',   label:'구분(매출/매입)',req:false, hint:'구분, 유형' },
    { id:'partner',label:'거래처명',       req:false, hint:'거래처, 상호, 가맹점' },
    { id:'bizno',  label:'사업자번호',     req:false, hint:'사업자번호' },
    { id:'supply', label:'공급가액',       req:false, hint:'공급가액, 공급액' },
    { id:'tax',    label:'세액/부가세',    req:false, hint:'세액, 부가세' },
    { id:'total',  label:'합계/금액',      req:false, hint:'합계, 금액, 총액' },
    { id:'memo',   label:'비고',           req:false, hint:'비고, 메모' },
  ],
};

const TYPE_LABELS = { tx:'거래내역', inv:'세금계산서', card:'법인카드', rc:'현금영수증' };
const TYPE_COLS = { tx:'📊', inv:'🧾', card:'💳', rc:'🧾' };

function openMap(type, fname, hdrs, rows) {
  const savedMap = MAPS[fname] || {};
  document.getElementById('mapTitle').textContent = TYPE_COLS[type] + ' ' + TYPE_LABELS[type] + ' 컬럼 매핑';
  document.getElementById('mapIntro').innerHTML =
    '<strong>' + fname + '</strong><br>엑셀 파일의 어떤 컬럼이 어떤 항목인지 선택해주세요. 다음부터는 자동으로 기억됩니다.';

  // 미리보기 (첫 3행)
  const prev = rows.slice(0, 3).map(r => hdrs.map((h, i) => h + ': ' + String(r[i] || '')).slice(0, 5).join('  |  ')).join('\n');
  document.getElementById('mapPreview').innerHTML = '<strong>미리보기 (상위 3행)</strong><pre style="margin-top:6px;white-space:pre-wrap;font-family:monospace;font-size:11px">' + prev + '</pre>';

  // 셀렉트 생성
  const opts = '<option value="">— 선택 안함 —</option>' + hdrs.map((h, i) =>
    '<option value="' + i + '">' + h + (rows[0] ? ' (예: ' + String(rows[0][i] || '').slice(0, 15) + ')' : '') + '</option>'
  ).join('');

  // 자동 매핑 힌트 함수
  function autoGuess(fieldId) {
    const hints = {
      date: /날짜|일자|일시|거래일|작성일|사용일|승인일/i,
      in: /^입금$|입금액|입금금액/i, out: /^출금$|출금액|출금금액/i,
      amount: /^금액$/i, name: /거래처|사용처|적요|내역|내용/i,
      memo: /메모|비고|사유|주요/i, bank: /거래수단|계좌|은행/i,
      cat: /계정과목/i, balance: /잔액|잔고/i,
      type: /구분|유형/i, partner: /거래처|상호|공급받는자/i,
      bizno: /사업자/i, item: /품목|품명/i,
      supply: /공급가액|공급액/i, tax: /^세액$|부가세/i,
      total: /합계|총액/i, company: /카드사|카드회사|카드명/i,
      cardno: /카드번호/i, holder: /보유자/i, user: /사용자|사용직원/i,
      merchant: /가맹점|거래처|사용처/i,
    };
    const pat = hints[fieldId];
    if (!pat) return '';
    const idx = hdrs.findIndex(h => pat.test(h));
    return idx !== -1 ? String(idx) : '';
  }

  const fields = FIELDS[type];
  document.getElementById('mapFields').innerHTML = fields.map(f => {
    const saved = savedMap[f.id] !== undefined ? String(savedMap[f.id]) : autoGuess(f.id);
    return '<div class="map-row">' +
      '<div class="map-label">' + f.label + (f.req ? '<span class="req">필수</span>' : '') + '</div>' +
      '<select class="map-sel" id="mf-' + f.id + '">' + opts + '</select>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:2px">' + f.hint + '</div>' +
      '</div>';
  }).join('');

  // 저장된/자동 매핑 적용
  fields.forEach(f => {
    const saved = savedMap[f.id] !== undefined ? String(savedMap[f.id]) : autoGuess(f.id);
    if (saved !== '') document.getElementById('mf-' + f.id).value = saved;
  });

  document.getElementById('mapSaveBtn').onclick = () => applyMap(type, fname, hdrs, rows, fields);
  // 은행명 직접입력 토글
  const mbSel = document.getElementById('mapBank');
  const mbCus = document.getElementById('mapBankCustom');
  const savedBank = (MAPS[fname] && MAPS[fname].__bank) || '';
  if (savedBank && !mbSel.querySelector('option[value="'+savedBank+'"]')) {
    mbSel.value = '__custom__'; mbCus.style.display=''; mbCus.value=savedBank;
  } else if (savedBank) { mbSel.value = savedBank; }
  mbSel.onchange = () => { mbCus.style.display = mbSel.value === '__custom__' ? '' : 'none'; };
  document.getElementById('mapModal').classList.add('open');
}

function closeMap() { document.getElementById('mapModal').classList.remove('open'); }

function applyMap(type, fname, hdrs, rows, fields) {
  // 매핑 저장
  const mapping = {};
  fields.forEach(f => {
    const v = document.getElementById('mf-' + f.id).value;
    mapping[f.id] = v !== '' ? parseInt(v) : -1;
  });
  // 은행명 저장
  const bankSel = document.getElementById('mapBank');
  const bankName = bankSel.value === '__custom__'
    ? document.getElementById('mapBankCustom').value.trim()
    : bankSel.value;
  if (type === 'tx' && !bankName) { alert('은행명을 선택해주세요.'); return; }
  mapping.__bank = bankName;
  MAPS[fname] = mapping;
  save(SK.map, MAPS);

  // 필수 필드 확인
  if (mapping.date === -1) { alert('날짜 컬럼은 필수입니다.'); return; }

  closeMap();

  let added = 0;
  if (type === 'tx') added = parseTx(rows, mapping, fname);
  else if (type === 'inv') added = parseInv(rows, mapping);
  else if (type === 'card') added = parseCard(rows, mapping);
  else if (type === 'rc') added = parseRc(rows, mapping);

  addFileItem(type, fname, added);
  alert('✅ ' + added + '건 추가됐습니다.');
}

function gc(row, idx) { return idx >= 0 ? String(row[idx] || '').trim() : ''; }
function gn(row, idx) { return idx >= 0 ? pNum(row[idx]) : 0; }
function gd(row, idx) { return idx >= 0 ? pDate(row[idx]) : ''; }

// ── 거래내역 파싱 ─────────────────────────────────────
function parseTx(rows, m, fname) {
  const existing = new Set(TXS.map(t => t.date + '|' + t.amount + '|' + t.type + '|' + t.name));
  let n = 0;
  rows.forEach(row => {
    const date = gd(row, m.date);
    if (!date) return;
    const bankRaw = m.__bank || gc(row, m.bank) || fname.replace(/\.[^.]+$/, '').slice(0, 10);
    const name = gc(row, m.name);
    const memo = gc(row, m.memo);
    const cat  = gc(row, m.cat);

    let inAmt = 0, outAmt = 0;
    if (m.in >= 0 || m.out >= 0) {
      inAmt  = gn(row, m.in);
      outAmt = gn(row, m.out);
    } else if (m.amount >= 0) {
      const v = gn(row, m.amount);
      if (v > 0) inAmt = v; else outAmt = Math.abs(v);
    }
    if (!inAmt && !outAmt) return;

    const addRow = (amount, type) => {
      const key = date + '|' + amount + '|' + type + '|' + name;
      if (existing.has(key)) return;
      existing.add(key);
      TXS.push({ id: Date.now().toString(36) + (Math.random() * 1e6 | 0) + n,
        date, type, amount, name, memo, bank: bankRaw,
        cat: cat || autoCat(name, memo, type) });
      n++;
    };
    if (inAmt)  addRow(inAmt,  'in');
    if (outAmt) addRow(outAmt, 'out');
  });
  save(SK.tx, TXS);
  return n;
}

// ── 세금계산서 파싱 ───────────────────────────────────
let invDefaultType = 'out';
function parseInv(rows, m) {
  let n = 0;
  rows.forEach(row => {
    const date = gd(row, m.date);
    if (!date) return;
    const supply = gn(row, m.supply);
    const tax    = m.tax >= 0 ? gn(row, m.tax) : Math.round(supply * 0.1);
    const total  = m.total >= 0 ? gn(row, m.total) : supply + tax;
    const typeRaw = gc(row, m.type);
    const invType = typeRaw.includes('매입') || typeRaw.includes('수취') ? 'in' : invDefaultType;
    INVS.push({ id: Date.now().toString(36) + n, date, type: invType,
      partner: gc(row, m.partner), bizno: gc(row, m.bizno), item: gc(row, m.item),
      supply, tax, total, memo: gc(row, m.memo) });
    n++;
  });
  save(SK.inv, INVS);
  return n;
}

// ── 법인카드 파싱 ─────────────────────────────────────
let cardDefaultType = 'in';
function parseCard(rows, m) {
  let n = 0;
  rows.forEach(row => {
    const date = gd(row, m.date);
    if (!date) return;
    const total  = gn(row, m.total);
    const tax    = m.tax >= 0 ? gn(row, m.tax) : Math.round(total / 11);
    const supply = m.supply >= 0 ? gn(row, m.supply) : total - tax;
    const typeRaw = gc(row, m.type);
    const cardType = typeRaw.includes('매출') || typeRaw.includes('수입') ? 'out' : cardDefaultType;
    CARDS.push({ id: Date.now().toString(36) + n, date, type: cardType,
      company: gc(row, m.company), cardno: gc(row, m.cardno),
      holder: gc(row, m.holder), user: gc(row, m.user),
      merchant: gc(row, m.merchant), bizno: gc(row, m.bizno),
      supply, tax, total, memo: gc(row, m.memo) });
    n++;
  });
  save(SK.card, CARDS);
  return n;
}

// ── 드래그앤드롭 ──────────────────────────────────────
['tx','inv','card','rc'].forEach(t => {
  const dz = document.getElementById('dz-' + t);
  if (!dz) return;
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag');
    Array.from(e.dataTransfer.files).forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => {
        const wb = XLSX.read(ev.target.result, { type:'array', cellDates:true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const raw = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
        let hi = 0;
        for (let i = 0; i < Math.min(15, raw.length); i++) {
          if (raw[i].filter(c => String(c).trim()).length >= 3) { hi = i; break; }
        }
        const hdrs = raw[hi].map(h => String(h || '').trim());
        const rows = raw.slice(hi + 1).filter(r => r.some(c => String(c).trim()));
        pendingFile = { type: t, file, hdrs, rows };
        openMap(t, file.name, hdrs, rows);
      };
      reader.readAsArrayBuffer(file);
    });
  });
});

function renderRc() {
  const rows = RCS.filter(r => r.type === rcSub).sort((a,b) => b.date.localeCompare(a.date));
  const sup = rows.reduce((s,r) => s+(r.supply||0), 0);
  const tax = rows.reduce((s,r) => s+(r.tax||0), 0);
  const tot = rows.reduce((s,r) => s+(r.total||0), 0);
  document.getElementById('rcStats').innerHTML = [
    ['공급가액', fmt(sup), rcSub==='out'?'cv-in':'cv-out'],
    ['세액', fmt(tax), 'cv-gold'],
    ['합계금액', fmt(tot), 'cv-n'],
    ['건수', rows.length+'건', 'cv-n'],
  ].map(([l,v,c])=>'<div class="stat-card"><div class="sc-label">'+l+'</div><div class="sc-value '+c+'">'+v+'</div></div>').join('');

  document.getElementById('tbRc').innerHTML = rows.length ? rows.map(r =>
    '<tr><td style="font-size:12px;color:var(--muted)">'+r.date+'</td>' +
    '<td title="'+r.partner+'">'+r.partner+'</td>' +
    '<td style="font-size:11px">'+r.bizno+'</td>' +
    '<td class="ra '+(rcSub==='out'?'amt-in':'amt-out')+'">'+fmt(r.supply)+'</td>' +
    '<td class="ra" style="color:var(--gold)">'+fmt(r.tax)+'</td>' +
    '<td class="ra" style="font-weight:600">'+fmt(r.total)+'</td>' +
    '<td style="color:var(--muted);font-size:12px">'+r.memo+'</td></tr>'
  ).join('') : '<tr><td colspan="7" class="empty">내역 없음</td></tr>';
}

// ── 월별분석 차트 ─────────────────────────────────────
let cIO = null, cCat = null, cNet = null;
function renderCharts() {
  const yr = document.getElementById('chartYear').value;
  const mos = Array.from({length:12},(_,i)=>yr+'-'+String(i+1).padStart(2,'0'));
  const labels = mos.map(m=>m.slice(5)+'월');
  const md = mos.map(m => {
    const t = TXS.filter(t=>t.date.startsWith(m));
    return { in:t.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0), out:t.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0) };
  });
  const PALETTE=['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#be185d','#065f46','#92400e','#1e3a5f'];

  const fix = v => +(v/10000).toFixed(0)+'만';
  const opts = (yFmt) => ({ plugins:{legend:{position:'top',labels:{boxWidth:12,font:{size:11}}}}, scales:{y:{beginAtZero:true,ticks:{callback:yFmt}}} });

  const ctxIO = document.getElementById('cIO').getContext('2d');
  if (cIO) cIO.destroy();
  cIO = new Chart(ctxIO, { type:'bar', data:{ labels, datasets:[
    {label:'입금',data:md.map(d=>d.in),backgroundColor:'rgba(37,99,235,.75)',borderRadius:4},
    {label:'출금',data:md.map(d=>d.out),backgroundColor:'rgba(220,38,38,.75)',borderRadius:4}
  ]}, options:opts(fix) });

  const netD = md.map(d=>d.in-d.out);
  const ctxNet = document.getElementById('cNet').getContext('2d');
  if (cNet) cNet.destroy();
  cNet = new Chart(ctxNet, { type:'line', data:{ labels, datasets:[{label:'순유동',data:netD,borderColor:'#16a34a',backgroundColor:'rgba(22,163,74,.08)',fill:true,tension:.3,pointRadius:4}]}, options:{ plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:fix}}}}});

  const catMap = {};
  TXS.filter(t=>t.type==='out'&&t.date.startsWith(yr)).forEach(t=>{catMap[t.cat]=(catMap[t.cat]||0)+t.amount;});
  const sorted = Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const ctxCat = document.getElementById('cCat').getContext('2d');
  if (cCat) cCat.destroy();
  cCat = new Chart(ctxCat, { type:'doughnut', data:{ labels:sorted.map(([k])=>k), datasets:[{data:sorted.map(([,v])=>v),backgroundColor:PALETTE,borderWidth:0}]}, options:{plugins:{legend:{position:'right',labels:{boxWidth:12,font:{size:11}}}},cutout:'60%'}});

  const total = sorted.reduce((s,[,v])=>s+v,0);
  document.getElementById('catDetail').innerHTML = '<div style="font-weight:600;margin-bottom:8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px">지출 계정과목 순위</div>' +
    sorted.map(([cat,amt],i)=>{
      const pct = total?((amt/total)*100).toFixed(1):0;
      return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">' +
        '<span style="width:8px;height:8px;border-radius:50%;background:'+PALETTE[i]+';flex-shrink:0"></span>' +
        '<span style="flex:1">'+cat+'</span>' +
        '<span style="color:var(--muted)">'+pct+'%</span>' +
        '<span style="font-weight:600;min-width:80px;text-align:right">'+fmt(amt)+'</span></div>';
    }).join('');
}

// ── 인라인 편집 ───────────────────────────────────────
let editingId = null;

function startEdit(id) {
  editingId = id;
  renderDash();
  setTimeout(() => {
    const el = document.getElementById('ei-name-' + id);
    if (el) el.focus();
  }, 50);
}

function cancelEdit() {
  editingId = null;
  renderDash();
}

function saveEdit(id) {
  const idx = TXS.findIndex(t => t.id === id);
  if (idx === -1) return;
  const nameEl = document.getElementById('ei-name-' + id);
  const catEl  = document.getElementById('ei-cat-' + id);
  const amtEl  = document.getElementById('ei-amt-' + id);
  const memoEl = document.getElementById('ei-memo-' + id);
  if (nameEl) TXS[idx].name = nameEl.value.trim();
  if (catEl)  TXS[idx].cat  = catEl.value.trim();
  if (amtEl)  TXS[idx].amount = Math.abs(parseFloat(amtEl.value) || TXS[idx].amount);
  if (memoEl) TXS[idx].memo = memoEl.value.trim();
  save(SK.tx, TXS);
  editingId = null;
  renderDash();
}

function delTx(id) {
  if (!confirm('이 거래를 삭제할까요?')) return;
  TXS = TXS.filter(t => t.id !== id);
  save(SK.tx, TXS);
  editingId = null;
  renderDash();
}

// ── 초기화 ────────────────────────────────────────────
(function init(){
  const ym = thisYM();
  document.getElementById('fMonth').value = ym;
  document.getElementById('bMonth').value = ym;
  document.getElementById('fStart').value = ym+'-01';
  document.getElementById('fEnd').value = today();
  document.getElementById('bStart').value = ym+'-01';
  document.getElementById('bEnd').value = today();

  // 연도 셀렉트
  const yr = document.getElementById('chartYear');
  const cy = parseInt(ym.slice(0,4));
  for (let y = cy; y >= cy-3; y--) yr.innerHTML += '<option value="'+y+'">'+y+'년</option>';
  yr.value = cy;

  // 기간 필터 이벤트
  document.getElementById('fMonth').addEventListener('change', renderDash);
  document.getElementById('fStart').addEventListener('change', renderDash);
  document.getElementById('fEnd').addEventListener('change', renderDash);
  document.getElementById('fBank').addEventListener('change', renderDash);
  document.getElementById('bMonth').addEventListener('change', renderBanks);
  document.getElementById('bStart').addEventListener('change', renderBanks);
  document.getElementById('bEnd').addEventListener('change', renderBanks);
})();
</script>
